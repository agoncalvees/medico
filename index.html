<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Médico</title>
  <meta name="description" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <!-- Todo o conteúdo do site vem de js/config.js -->
  <script src="js/config.js"></script>
</head>
<body>

  <!-- HEADER -->
  <header class="header" id="topo">
    <div class="header__inner">
      <nav class="header__nav" id="menu"></nav>
      <a href="#topo" class="header__logo" id="logo-topo" aria-label="Início"></a>
      <div class="header__acoes">
        <a class="icone-link" id="link-instagram" target="_blank" rel="noopener" aria-label="Instagram"></a>
        <a class="icone-link" data-whats target="_blank" rel="noopener" aria-label="WhatsApp" id="link-whats-topo"></a>
        <a class="btn btn--primario btn--sm" data-whats target="_blank" rel="noopener">Agendar Consulta</a>
        <button class="header__burger" id="burger" aria-label="Abrir menu" aria-expanded="false"><span></span><span></span><span></span></button>
      </div>
    </div>
    <div class="menu-mobile" id="menu-mobile"></div>
  </header>

  <main>
    <!-- HERO -->
    <section class="hero" id="hero">
      <div class="hero__fundo" id="hero-fundo"></div>
      <img class="hero__medico" id="hero-foto" alt="">
      <div class="hero__conteudo container">
        <div class="hero__texto">
          <div class="hero__logo" id="logo-hero"></div>
          <h1 class="hero__titulo" id="hero-titulo"></h1>
          <span class="hero__linha"></span>
          <p class="hero__subtitulo" id="hero-subtitulo"></p>
          <a class="btn btn--primario" data-whats target="_blank" rel="noopener" id="hero-botao"></a>
        </div>
      </div>
      <div class="hero__faixa"><div class="hero__faixa-trilho" id="hero-faixa"></div></div>
    </section>

    <!-- QUEM SOU EU -->
    <section class="sobre" id="sobre">
      <div class="container sobre__grid">
        <div class="sobre__foto revelar"><img id="sobre-foto" alt=""></div>
        <div class="sobre__texto revelar">
          <span class="etiqueta" id="sobre-etiqueta"></span>
          <h2 class="sobre__nome" id="sobre-nome"></h2>
          <div id="sobre-paragrafos"></div>
          <a class="btn btn--primario" data-whats target="_blank" rel="noopener" id="sobre-botao"></a>
        </div>
      </div>
    </section>

    <!-- O QUE EU RESOLVO -->
    <section class="servicos secao-escura" id="servicos">
      <div class="textura"></div>
      <div class="container">
        <div class="cabecalho cabecalho--claro revelar">
          <span class="etiqueta etiqueta--azul" id="servicos-etiqueta"></span>
          <h2 class="titulo-grande" id="servicos-titulo"></h2>
        </div>
        <div class="servicos__grid" id="servicos-grid"></div>
      </div>
    </section>

    <!-- SINTOMAS -->
    <section class="sintomas" id="sintomas">
      <div class="container">
        <h2 class="sintomas__titulo revelar" id="sintomas-titulo"></h2>
        <div class="sintomas__diagrama" id="sintomas-diagrama">
          <svg class="sintomas__linhas" id="sintomas-linhas" aria-hidden="true"></svg>
          <div class="sintomas__marca sintomas__marca--a" aria-hidden="true"></div>
          <div class="sintomas__marca sintomas__marca--b" aria-hidden="true"></div>
          <div class="sintomas__foto" id="sintomas-foto-wrap"><img id="sintomas-foto" alt=""></div>
          <ul class="sintomas__lista" id="sintomas-lista"></ul>
        </div>
      </div>
    </section>

    <!-- ONDE ME ENCONTRA -->
    <section class="atendimento" id="atendimento">
      <div class="container">
        <div class="cabecalho revelar">
          <span class="etiqueta etiqueta--cinza" id="atendimento-etiqueta"></span>
          <h2 class="titulo-grande titulo-grande--forte" id="atendimento-titulo"></h2>
          <p class="cabecalho__sub" id="atendimento-subtitulo"></p>
        </div>
        <div class="grade-3" id="atendimento-cards"></div>
      </div>
    </section>

    <!-- DIFERENCIAIS -->
    <section class="diferenciais" id="diferenciais">
      <div class="container">
        <div class="cabecalho revelar">
          <span class="etiqueta" id="diferenciais-etiqueta"></span>
          <h2 class="titulo-grande" id="diferenciais-titulo"></h2>
          <p class="cabecalho__sub" id="diferenciais-subtitulo"></p>
        </div>
        <div class="grade-3" id="diferenciais-cards"></div>
      </div>
    </section>

    <!-- FAQ -->
    <section class="faq" id="faq">
      <div class="container container--estreito">
        <div class="cabecalho revelar">
          <h2 class="titulo-grande" id="faq-titulo"></h2>
          <p class="cabecalho__sub" id="faq-subtitulo"></p>
        </div>
        <div class="faq__lista" id="faq-lista"></div>
        <div class="faq__caixa revelar">
          <h3 id="faq-caixa-titulo"></h3>
          <p id="faq-caixa-texto"></p>
          <a class="btn btn--primario" data-whats target="_blank" rel="noopener" id="faq-caixa-botao"></a>
        </div>
      </div>
    </section>

    <!-- CONSULTÓRIO -->
    <section class="consultorio" id="consultorio">
      <div class="container">
        <div class="cabecalho revelar">
          <span class="etiqueta" id="consultorio-etiqueta"></span>
          <h2 class="titulo-grande" id="consultorio-titulo"></h2>
          <p class="cabecalho__sub" id="consultorio-subtitulo"></p>
        </div>
        <div class="consultorio__grid">
          <div class="consultorio__info">
            <div class="info-bloco revelar">
              <div class="info-bloco__icone" data-icone="pin"></div>
              <h3>Endereço</h3>
              <p id="consultorio-endereco"></p>
              <div class="info-bloco__links">
                <a id="link-maps" target="_blank" rel="noopener">Google Maps</a>
                <a id="link-waze" target="_blank" rel="noopener">Waze</a>
              </div>
            </div>
            <div class="info-bloco revelar">
              <div class="info-bloco__icone" data-icone="telefone"></div>
              <h3>Contato</h3>
              <p id="consultorio-contato"></p>
            </div>
            <div class="info-bloco revelar">
              <div class="info-bloco__icone" data-icone="predio"></div>
              <h3>Facilidades</h3>
              <p id="consultorio-facilidades"></p>
            </div>
            <a class="btn btn--primario btn--grande" data-whats target="_blank" rel="noopener" id="consultorio-botao"></a>
          </div>
          <div class="consultorio__mapa revelar">
            <iframe id="mapa" title="Mapa do consultório" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="rodape">
    <div class="container rodape__grid">
      <div class="rodape__marca">
        <div id="logo-rodape"></div>
        <p id="rodape-frase"></p>
      </div>
      <nav class="rodape__nav" id="rodape-nav" aria-label="Navegação do rodapé"></nav>
      <div class="rodape__contato" id="rodape-contato"></div>
    </div>
    <div class="container rodape__base">
      <span id="rodape-copy"></span>
      <span id="rodape-creditos"></span>
    </div>
  </footer>

  <a class="whats-flutuante" data-whats target="_blank" rel="noopener" aria-label="Falar no WhatsApp" id="whats-flutuante"></a>

  <script src="js/main.js"></script>
</body>
</html>
